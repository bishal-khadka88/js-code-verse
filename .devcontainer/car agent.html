<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Car Simulation</title>
<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#222;
    overflow:hidden;
}
canvas{
    border:3px solid #333;
    background:white;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>
<canvas id="canvas" width="1000" height="550"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let carX = -150;
const carY = 355;
const finishLine = 760;
let trafficLight = "GREEN";
let timer = 0;

function drawCloud(x,y){
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(x,y,20,0,Math.PI*2);
    ctx.arc(x+25,y-10,25,0,Math.PI*2);
    ctx.arc(x+55,y,20,0,Math.PI*2);
    ctx.fill();
}

function drawSun(){
    ctx.beginPath();
    ctx.arc(120,80,40,0,Math.PI*2);
    ctx.fillStyle="#FFD700";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(120,80,55,0,Math.PI*2);
    ctx.fillStyle="rgba(255,215,0,0.25)";
    ctx.fill();
}
function drawHouse(x,y){
    ctx.fillStyle="#f39c12";
    ctx.fillRect(x,y,100,80);
    ctx.fillStyle="#8e44ad";
    ctx.beginPath();
    ctx.moveTo(x-10,y);
    ctx.lineTo(x+50,y-45);
    ctx.lineTo(x+110,y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle="white";
    ctx.fillRect(x+15,y+15,20,20);
    ctx.fillRect(x+65,y+15,20,20);
    ctx.fillStyle="#6d4c41";
    ctx.fillRect(x+40,y+45,22,35);
}
function drawBamboo(x,y){
    ctx.fillStyle="#2e7d32";
    ctx.fillRect(x,y,8,100);
    for(let i=0;i<6;i++){
        ctx.fillRect(x-2,y+i*16,12,2);
    }
    ctx.fillStyle="#43a047";
    ctx.beginPath();
    ctx.ellipse(x-15,y+20,15,5,-0.5,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x+20,y+40,15,5,0.5,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x-15,y+65,15,5,-0.5,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x+20,y+85,15,5,0.5,0,Math.PI*2);
    ctx.fill();
}
function drawRoad(){
    ctx.fillStyle="#555";
    ctx.fillRect(0,300,1000,140);
    ctx.strokeStyle="white";
    ctx.lineWidth=5;
    ctx.setLineDash([25,15]);
    ctx.beginPath();
    ctx.moveTo(0,370);
    ctx.lineTo(1000,370);
    ctx.stroke();
    ctx.setLineDash([]);
}
function drawZebra(){
    for(let y=300;y<440;y+=20){
        ctx.fillStyle="white";
        ctx.fillRect(finishLine,y,20,10);
        ctx.fillStyle="black";
        ctx.fillRect(finishLine+20,y,20,10);
    }
}

function drawTrafficLight(){
    ctx.fillStyle="#333";
    ctx.fillRect(720,140,80,40);
    ctx.beginPath();
    ctx.arc(745,160,12,0,Math.PI*2);
    ctx.fillStyle=trafficLight==="GREEN"?"lime":"darkgreen";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(775,160,12,0,Math.PI*2);
    ctx.fillStyle=trafficLight==="RED"?"red":"darkred";
    ctx.fill();
    ctx.fillStyle="gray";
    ctx.fillRect(757,180,6,120);
}
function drawCar(x,y){
    // Shadow
    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(x+60,y+52,65,10,0,0,Math.PI*2);
    ctx.fill();

    // Body
    ctx.fillStyle="#e53935";
    ctx.beginPath();
    ctx.roundRect(x,y,120,40,10);
    ctx.fill();

    // Top
    ctx.fillStyle="#c62828";
    ctx.beginPath();
    ctx.moveTo(x+25,y);
    ctx.lineTo(x+45,y-22);
    ctx.lineTo(x+85,y-22);
    ctx.lineTo(x+105,y);
    ctx.closePath();
    ctx.fill();

    // Windows
    ctx.fillStyle="#b3e5fc";
    ctx.fillRect(x+48,y-18,15,15);
    ctx.fillRect(x+67,y-18,15,15);

    // Lights
    ctx.fillStyle="#fff176";
    ctx.fillRect(x+113,y+10,6,8);
    ctx.fillStyle="#ff5252";
    ctx.fillRect(x+2,y+10,6,8);

    // Door
    ctx.strokeStyle="#7f0000";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x+60,y+2);
    ctx.lineTo(x+60,y+38);
    ctx.stroke();

    // Wheels
    ctx.fillStyle="#111";
    ctx.beginPath();
    ctx.arc(x+28,y+40,14,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x+92,y+40,14,0,Math.PI*2);
    ctx.fill();

    // Rims
    ctx.fillStyle="#ddd";
    ctx.beginPath();
    ctx.arc(x+28,y+40,6,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x+92,y+40,6,0,Math.PI*2);
    ctx.fill();
}
function updateTrafficLight(){
    timer += 16.67;
    if(trafficLight==="GREEN" && timer>=6000){
        trafficLight="RED";
        timer=0;
    }
    else if(trafficLight==="RED" && timer>=10000){
        trafficLight="GREEN";
        timer=0;
    }
}
function update() {
    updateTrafficLight();

    let stopPosition = finishLine - 130;

    if (trafficLight === "RED" && carX >= stopPosition) {
        carX = stopPosition; 
    } else {
        carX += 4; 
    }

    if (carX > canvas.width) {
        carX = -150; 
    }
}
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Sky
    ctx.fillStyle="#87CEEB";
    ctx.fillRect(0,0,1000,300);
    ctx.fillStyle="#4CAF50";
    ctx.fillRect(0,220,1000,330);

    drawSun();
    drawCloud(200,70);
    drawCloud(500,90);
    drawCloud(760,70);

    drawHouse(180,210);
    drawHouse(470,210);

    drawRoad();
    drawZebra();
    drawTrafficLight();

    drawCar(carX,carY);
    update();
    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
